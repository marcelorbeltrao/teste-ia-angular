<mat-card>
  <mat-card-content>
    <div class="ss-grid">
      <div class="col-6">
        <form [formGroup]="formGroup">
          <div class="ss-grid">
            <mat-form-field class="col-2">
              <mat-label>Cor</mat-label>
              <input matInput type="color" formControlName="color" />
            </mat-form-field>
            <mat-form-field class="col-10">
              <mat-label>Email</mat-label>
              <input matInput placeholder="Email" formControlName="email" />
              <mat-error *ngIf="formGroup.get('email').hasError('required')">
                Insira um email válido
              </mat-error>
            </mat-form-field>
          </div>
          <mat-form-field>
            <mat-label>Data</mat-label>
            <input matInput type="date" formControlName="date" />
          </mat-form-field>
          <mat-form-field>
            <mat-label>Data e Hora</mat-label>
            <input matInput type="datetime-local" formControlName="datetime" />
          </mat-form-field>
          <mat-form-field>
            <mat-label>Mês</mat-label>
            <input matInput type="month" formControlName="month" />
          </mat-form-field>
          <mat-form-field>
            <mat-label>Número com Máscara</mat-label>
            <input matInput formControlName="number" mask="999-999.99" showMaskTyped="true" />
          </mat-form-field>
          <mat-form-field>
            <mat-label>Senha</mat-label>
            <input matInput type="password" formControlName="password" />
          </mat-form-field>
          <mat-form-field>
            <mat-label>Buscar</mat-label>
            <input matInput type="search" formControlName="search" />
          </mat-form-field>
          <mat-form-field>
            <mat-label>Telefone</mat-label>
            <input matInput formControlName="text" mask="(00) 0000-0000 || (00) 00000-0000" />
          </mat-form-field>
          <mat-form-field>
            <mat-label>Texto</mat-label>
            <input matInput type="text" formControlName="text" />
          </mat-form-field>
          <mat-form-field>
            <mat-label>Horário</mat-label>
            <input matInput type="time" formControlName="time" />
          </mat-form-field>
          <mat-form-field>
            <mat-label>URL</mat-label>
            <input matInput type="url" formControlName="url" />
          </mat-form-field>
          <mat-form-field>
            <mat-label>Semana</mat-label>
            <input matInput type="week" formControlName="week" />
          </mat-form-field>
          <mat-form-field>
            <mat-label>Monetário (R$)</mat-label>
            <input matInput type="text" formControlName="currency" currencyMask />
          </mat-form-field>
        </form>
      </div>
      <div class="col-6">
        <h6>Checkbox</h6>
        <section class="example-section">
          <mat-checkbox class="example-margin">Check me!</mat-checkbox>
          <mat-checkbox class="example-margin" [disabled]="true">Disabled</mat-checkbox>
        </section>
        <section class="example-section">
          <span class="example-list-section">
            <mat-checkbox class="example-margin" [checked]="allComplete" [color]="task.color"
              [indeterminate]="someComplete()" (change)="setAll($event.checked)">
              {{task.name}}
            </mat-checkbox>
          </span>
          <span class="example-list-section">
            <ul class="margin-top-0 example-list">
              <li *ngFor="let subtask of task.subtasks">
                <mat-checkbox [(ngModel)]="subtask.completed" [color]="subtask.color"
                  (ngModelChange)="updateAllComplete()">
                  {{subtask.name}}
                </mat-checkbox>
              </li>
            </ul>
          </span>
        </section>
      </div>
      <div class="col-6">
        <b>Máscara monetária</b>
        {{ formGroup.get("currency").value | currency }}
      </div>
    </div>
  </mat-card-content>
</mat-card>
