<mat-card>
  <mat-card-header>
    <mat-card-title>
      <h6>Tabela com seleção</h6>
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>


    <form [formGroup]="moviesForm">
      <table mat-table [dataSource]="dataSourceTable">

        <!-- Checkbox Column -->
        <ng-container matColumnDef="selected">
          <th mat-header-cell *matHeaderCellDef>
            <mat-checkbox (change)="$event ? toggleAllRows() : null" [checked]="selection.hasValue() && isAllSelected()"
              [indeterminate]="selection.hasValue() && !isAllSelected()" [aria-label]="checkboxLabel()">
            </mat-checkbox>
          </th>
          <td mat-cell *matCellDef="let row">
            <mat-checkbox (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null"
              [checked]="selection.isSelected(row)" [aria-label]="checkboxLabel(row)">
            </mat-checkbox>
          </td>
        </ng-container>


        <ng-container matColumnDef="movie" >
          <th mat-header-cell *matHeaderCellDef> movie </th>
          <td mat-cell *matCellDef="let element"> {{element.movie}} </td>
        </ng-container>

        <ng-container matColumnDef="director">
          <th mat-header-cell *matHeaderCellDef> director </th>
          <td mat-cell *matCellDef="let item"> {{item.director}} </td>
        </ng-container>

        <ng-container matColumnDef="year">
          <th mat-header-cell *matHeaderCellDef> year </th>
          <td mat-cell *matCellDef="let item"> {{item.year}} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="selection.toggle(row)" matRippleColor="'#7DB61C'">
        </tr>
      </table>
    </form>

  </mat-card-content>
</mat-card>
